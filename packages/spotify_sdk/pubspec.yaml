name: spotify_sdk
publish_to: none
description: A Flutter plugin for communicating with Spotify App Remote SDK and Spotify Web Playback SDK.
version: 4.0.0
homepage: https://github.com/brim-borium/spotify_sdk
repository: https://github.com/brim-borium/spotify_sdk/tree/main/packages/spotify_sdk
issue_tracker: https://github.com/brim-borium/spotify_sdk/issues
topics:
  - spotify
  - audio
  - music
  - playback
  - sdk
resolution: workspace

environment:
  sdk: ^3.13.0
  flutter: '>=3.47.0'

dependencies:
  flutter:
    sdk: flutter
  spotify_sdk_android:
    git:
      url: https://github.com/EngineeringSuccess/spotify_sdk.git
      ref: jeojeo-4.0.0
      path: packages/spotify_sdk_android
  spotify_sdk_ios:
    git:
      url: https://github.com/EngineeringSuccess/spotify_sdk.git
      ref: jeojeo-4.0.0
      path: packages/spotify_sdk_ios
  spotify_sdk_platform_interface:
    git:
      url: https://github.com/EngineeringSuccess/spotify_sdk.git
      ref: jeojeo-4.0.0
      path: packages/spotify_sdk_platform_interface
  spotify_sdk_web:
    git:
      url: https://github.com/EngineeringSuccess/spotify_sdk.git
      ref: jeojeo-4.0.0
      path: packages/spotify_sdk_web

dev_dependencies:
  flutter_test:
    sdk: flutter
  plugin_platform_interface: ^2.1.8
  very_good_analysis: ^10.3.0

flutter:
  plugin:
    platforms:
      android:
        default_package: spotify_sdk_android
      ios:
        default_package: spotify_sdk_ios
      web:
        default_package: spotify_sdk_web
